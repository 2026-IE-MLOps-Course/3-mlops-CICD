# config.yaml
# Single source of truth for NON-SECRET runtime settings
# Secrets (WANDB_API_KEY, deploy hooks, passwords) belong in .env or GitHub Secrets, NEVER here

paths:
  raw_data: "data/raw/opioid_raw_data.csv"
  processed_data: "data/processed/clean.csv"
  model_artifact: "models/model.joblib"
  inference_data: "data/inference/opioid_infer_01.csv"
  predictions_artifact: "reports/predictions.csv"
  log_file: "logs/pipeline.log"

logging:
  level: "INFO" # "DEBUG", "INFO", "WARNING", "ERROR"

problem:
  target_column: "OD"
  problem_type: "classification" # "classification" or "regression"
  identifier_column: "ID"

split:
  # 15% test and 15% validation gives about 150 rows each on 1000 rows
  # Smaller splits (e.g. 5% = 50 rows) make metrics too noisy to trust
  test_size: 0.15
  val_size: 0.15
  random_state: 42

training:
  classification:
    model_type: "logistic_regression"
    max_iter: 500
    solver: "liblinear"
    random_state: 42
    class_weight: null

    # Calibration makes probabilities more reliable for thresholds and risk scores
    calibration_enabled: true
    calibration_method: "sigmoid" # "sigmoid" is a simple default for small/medium datasets
    calibration_cv: 3 # Cross-validation folds used inside CalibratedClassifierCV

  regression:
    model_type: "linear_regression"

features:
  quantile_bin:
    - "rx_ds"
  categorical_onehot: []
  # Each indicator flag as its own feature (lets the model learn which diagnoses matter)
  numeric_passthrough:
    - "A"
    - "B"
    - "C"
    - "D"
    - "E"
    - "F"
    - "H"
    - "I"
    - "J"
    - "K"
    - "L"
    - "M"
    - "N"
    - "R"
    - "S"
    - "T"
    - "Low_inc"
    - "SURG"
  # Derived feature: number of flags per patient (summed inside the pipeline)
  binary_sum_cols:
    - "A"
    - "B"
    - "C"
    - "D"
    - "E"
    - "F"
    - "H"
    - "I"
    - "J"
    - "K"
    - "L"
    - "M"
    - "N"
    - "R"
    - "S"
    - "T"
    - "Low_inc"
    - "SURG"
  n_bins: 4

validation:
  numeric_non_negative_cols:
    - "rx_ds"
  check_missing_values: false # false because imputers in features.py handle missing values

evaluation:
  calibration_bins: 10
  # Report metrics once on the untouched test split (final audit, never used for tuning)
  evaluate_on_test: true
  # Model quality gate: the pipeline stops and does NOT save the model if this fails
  # Baseline for PR AUC is the positive rate (about 0.18), so 0.40 means "clearly better than guessing"
  quality_gate:
    enabled: true
    metric: "pr_auc" # classification: "pr_auc" or "roc_auc", regression: "rmse"
    min_value: 0.40 # use max_value instead for "lower is better" metrics such as rmse

run:
  include_proba_if_classification: true

api:
  # Number of predictions buffered before one batch is sent to the tracker (Layer 2 monitoring)
  # 1 means one tracker run per request: easy to demo, but slow and noisy in production
  log_batch_size: 20

wandb:
  enabled: true
  project: "opioid-risk-classification_demo"

  name: "01-calibrated-logistic-regression-unweighted"
  job_type: "training-pipeline"
  group: "session11-baselines"
  tags: ["baseline", "logreg", "calibrated"]
  notes: "Logistic regression with per-flag features and probability calibration"

  model_artifact_name: "opioid_classification_model"
  log_processed_data: true
  log_predictions: true

  log_auc_plots: true
  log_confusion_matrix: true
  log_calibration_table: true
  log_predictions_table: true
  predictions_table_rows: 200
  class_names: ["No event", "Event"]

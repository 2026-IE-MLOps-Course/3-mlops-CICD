[pytest]
# Look for tests in the "tests" folder only
testpaths = tests
# Test files start with "test_"
python_files = test_*.py
# Make "import src..." work no matter how pytest is launched
pythonpath = .
# Skip folders that never contain tests (faster discovery)
norecursedirs = notebooks data models reports logs wandb .git __pycache__
# -q: short output. Add coverage with: pytest --cov=src --cov-report=term-missing
addopts = -q

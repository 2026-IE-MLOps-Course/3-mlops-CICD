# ci.yml: Continuous Integration (CI), the automatic quality gate
# Runs on every Pull Request to dev or main, on every push to main,
# and is reused by deploy.yml to recheck the exact commit being released
# Branch protection: require the "lint" and "test-and-build" checks on dev and main
# Evidence: every run keeps the pipeline log, predictions and coverage as a downloadable artifact

name: CI - Quality Gate

on:
    pull_request:
        branches: ["dev", "main"]
    push:
        branches: ["main"]
    workflow_dispatch:
    workflow_call:
        inputs:
            ref:
                description: "Git ref to check (deploy.yml passes the release tag)"
                type: string
                required: false
                default: ""

# Least privilege: CI only reads the code
permissions:
    contents: read

# A new push to the same Pull Request cancels the old, now useless, run
concurrency:
    group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # 1. Fast style check: fails in seconds, before the slow steps start
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.ref }}

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Run flake8 (same rules as the VS Code PROBLEMS tab, see .flake8)
              run: |
                  pip install flake8
                  flake8

    # 2. Rebuild the exact environment, run the pipeline, the tests and the Docker build
    test-and-build:
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            WANDB_MODE: disabled # CI checks our code, not W&B uptime: no account, no secrets
            MODEL_SOURCE: local
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.ref }}

            # Cache the downloaded conda packages; a new key whenever conda-lock.yml changes
            - name: Cache conda packages
              uses: actions/cache@v5
              with:
                  path: ~/conda_pkgs_dir
                  key: conda-${{ runner.os }}-${{ hashFiles('conda-lock.yml') }}

            - name: Setup Miniconda
              uses: conda-incubator/setup-miniconda@v3
              with:
                  auto-activate-base: true
                  use-only-tar-bz2: true # required for the package cache to work

            - name: Install the exact environment from conda-lock.yml
              shell: bash -el {0}
              run: |
                  conda install -n base -c conda-forge conda-lock -y
                  conda run -n base conda-lock install --name mlops conda-lock.yml

            # DVC is in environment.yml; this pinned install covers a conda-lock.yml not yet regenerated
            - name: Install DVC
              shell: bash -el {0}
              run: |
                  conda activate mlops
                  pip install "dvc==3.67.1"

            - name: Run the full pipeline with DVC (the model quality gate runs here)
              shell: bash -el {0}
              run: |
                  conda activate mlops
                  dvc repro

            - name: Write the quality gate result to the run summary
              if: always()
              run: |
                  echo "### Pipeline evidence for ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
                  echo '```text' >> "$GITHUB_STEP_SUMMARY"
                  grep -E "Validation metrics|Quality gate|Test metrics" logs/pipeline.log >> "$GITHUB_STEP_SUMMARY" || echo "No gate result: the pipeline stopped earlier" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"

            - name: Run tests with coverage (minimum 75%)
              shell: bash -el {0}
              run: |
                  conda activate mlops
                  pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=75

            - name: Keep the evidence as a traceable artifact, pass or fail
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: pipeline-evidence-${{ github.sha }}
                  path: |
                      logs/pipeline.log
                      reports/predictions.csv
                      coverage.xml
                      dvc.lock
                  retention-days: 30
                  if-no-files-found: warn

            - name: Docker image must build
              run: docker build -t mlops-api:ci .
